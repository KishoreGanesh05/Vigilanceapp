databases:
  - name: vigilance-db
    databaseName: vigilance
    user: vigilance_user
    plan: free
    region: singapore  # closest to India on Render's free tier

services:
  # ─── Backend API ───────────────────────────────────────────────────
  - type: web
    name: vigilance-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vigilance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure random value
      - key: ENCRYPTION_KEY
        generateValue: true          # used for report encryption at rest
      - key: PINATA_API_KEY
        sync: false                  # you fill this in manually in Render dashboard
      - key: PINATA_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false                  # set to your frontend URL after deploy
    healthCheckPath: /health

  # ─── Frontend ──────────────────────────────────────────────────────
  - type: web
    name: vigilance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    envVars:
      - key: VITE_API_URL
        sync: false                  # set to your backend URL after first deploy
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer           # don't leak referrer — important for reporter privacy
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html     # SPA fallback routing

  # ─── Keep-Alive Cron ───────────────────────────────────────────────
  # REMOVED — free plan not supported for cron jobs on Render.
  # The keep-alive ping is now handled by GitHub Actions (.github/workflows/keep-alive.yml)
