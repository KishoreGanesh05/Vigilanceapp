services:
  # ─── Backend API ───────────────────────────────────────────────────
  - type: web
    name: vigilance-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false                  # you fill this in manually in Render dashboard (Neon DB URI)
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure random value
      - key: ENCRYPTION_KEY
        generateValue: true          # used for report encryption at rest
      - key: PINATA_API_KEY
        sync: false                  # you fill this in manually in Render dashboard
      - key: PINATA_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false                  # frontend URL, no trailing slash (e.g. https://vigilance-frontend.onrender.com)
      - key: MODERATOR_SECRET
        sync: false                  # your moderator dashboard password — set in Render dashboard
    healthCheckPath: /health

  # ─── Frontend ──────────────────────────────────────────────────────
  - type: web
    name: vigilance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    envVars:
      - key: VITE_API_URL
        sync: false                  # set to your backend URL after first deploy
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer           # don't leak referrer — important for reporter privacy
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html     # SPA fallback routing
